server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy ─────────────────────────────────────────────────────────────
    # El frontend llama a /api/products, /api/login, etc.
    # nginx quita el prefijo /api y reenvía al backend Go en :5050
    location /api/ {
        proxy_pass         http://api:5050/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Soporte para uploads grandes (imágenes de productos)
        client_max_body_size 20M;
    }

    # ── Assets estáticos — caché agresivo ────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — todas las rutas del frontend devuelven index.html ──────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
