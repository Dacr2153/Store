<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f3f4f6" />
  
  <!-- Page Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  <rect x="20" y="20" width="120" height="30" rx="4" fill="#4f46e5" />
  <text x="80" y="40" font-family="Arial" font-size="16" fill="white" text-anchor="middle">ShopDrop</text>
  
  <!-- Navigation Menu -->
  <rect x="200" y="20" width="60" height="30" rx="4" fill="#ffffff" />
  <text x="230" y="40" font-family="Arial" font-size="14" fill="#4b5563" text-anchor="middle">Home</text>
  
  <rect x="270" y="20" width="60" height="30" rx="4" fill="#ffffff" />
  <text x="300" y="40" font-family="Arial" font-size="14" fill="#4b5563" text-anchor="middle">Shop</text>
  
  <rect x="340" y="20" width="100" height="30" rx="4" fill="#ffffff" />
  <text x="390" y="40" font-family="Arial" font-size="14" fill="#4b5563" text-anchor="middle">Try-On</text>
  
  <rect x="450" y="20" width="60" height="30" rx="4" fill="#ffffff" />
  <text x="480" y="40" font-family="Arial" font-size="14" fill="#4b5563" text-anchor="middle">Cart</text>
  
  <!-- Page Title -->
  <text x="100" y="110" font-family="Arial" font-size="24" fill="#111827" font-weight="bold">Virtual Try-On</text>
  <text x="100" y="140" font-family="Arial" font-size="16" fill="#6b7280">Try our products virtually before you buy</text>
  
  <!-- Main Content Container -->
  <rect x="50" y="170" width="1100" height="680" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  
  <!-- Video Call Component - Maximized View -->
  <g>
    <!-- Background -->
    <rect x="70" y="190" width="730" height="500" rx="8" fill="#000000" />
    
    <!-- Video Feed -->
    <rect x="80" y="200" width="710" height="470" rx="6" fill="#333333" />
    
    <!-- Face Position Guide -->
    <rect x="415" y="380" width="40" height="40" rx="2" stroke="#ffffff" stroke-width="2" fill="none" />
    <line x1="435" y1="380" x2="435" y2="420" stroke="#ffffff" stroke-width="1" />
    <line x1="415" y1="400" x2="455" y2="400" stroke="#ffffff" stroke-width="1" />
    
    <!-- Control Bar -->
    <rect x="70" y="660" width="730" height="60" rx="4" fill="rgba(0,0,0,0.6)" />
    
    <!-- Video Controls -->
    <circle cx="300" cy="690" r="20" fill="#ffffff" opacity="0.8" />
    <rect x="290" y="683" width="20" height="14" rx="2" fill="#000000" />
    
    <circle cx="360" cy="690" r="20" fill="#ffffff" opacity="0.8" />
    <circle cx="360" cy="690" r="8" fill="#000000" />
    <path d="M 368 683 L 372 687 L 368 691" stroke="#000000" stroke-width="2" fill="none" />
    
    <circle cx="420" cy="690" r="20" fill="#ffffff" opacity="0.8" />
    <rect x="413" y="686" width="14" height="8" rx="2" fill="#000000" />
    
    <!-- Close Button -->
    <circle cx="760" cy="220" r="15" fill="#ffffff" opacity="0.7" />
    <line x1="753" y1="213" x2="767" y2="227" stroke="#000000" stroke-width="2" />
    <line x1="753" y1="227" x2="767" y2="213" stroke="#000000" stroke-width="2" />
    
    <!-- YouTube Video -->
    <rect x="100" y="490" width="220" height="130" rx="6" fill="#ffffff" opacity="0.8" />
    <rect x="110" y="500" width="200" height="110" rx="4" fill="#f1f1f1" />
    <polygon points="190,545 170,535 170,555" fill="#ff0000" />
    
    <!-- Analysis Panel -->
    <rect x="550" y="490" width="220" height="130" rx="6" fill="#ffffff" opacity="0.8" />
    <text x="560" y="510" font-family="Arial" font-size="12" fill="#000000" font-weight="bold">Análisis en tiempo real:</text>
    <foreignObject x="560" y="520" width="200" height="90">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Arial; font-size: 11px; color: #333333;">
        Para tu tono de piel, recomendaría los labiales de Ésika en tonos coral como "Sunset Dream". Los polvos compactos de L'bel serían ideales para un acabado natural, y para tus ojos, las sombras de Cyzone en tonalidades neutras resaltarían tu mirada.
      </div>
    </foreignObject>
  </g>
  
  <!-- Chat Interface -->
  <g>
    <!-- Chat Window -->
    <rect x="820" y="190" width="310" height="500" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    
    <!-- Chat Header -->
    <rect x="820" y="190" width="310" height="50" rx="8 8 0 0" fill="#4f46e5" />
    <text x="860" y="220" font-family="Arial" font-size="16" fill="#ffffff" font-weight="bold">AI Assistant</text>
    <circle cx="840" cy="215" r="10" fill="#ffffff" />
    <text x="840" cy="220" font-family="Arial" font-size="14" fill="#4f46e5" text-anchor="middle">AI</text>
    
    <!-- Window Controls -->
    <circle cx="1090" cy="215" r="10" fill="#ffffff" opacity="0.2" />
    <rect x="1085" y="212" width="10" height="6" fill="#4f46e5" />
    
    <circle cx="1115" cy="215" r="10" fill="#ffffff" opacity="0.2" />
    <line x1="1110" y1="215" x2="1120" y2="215" stroke="#ffffff" stroke-width="2" />
    
    <!-- Chat Messages -->
    <rect x="840" y="260" width="220" height="40" rx="18" fill="#ffffff" />
    <text x="850" y="285" font-family="Arial" font-size="12" fill="#4b5563">¿Cómo puedo ayudarte hoy?</text>
    
    <rect x="880" y="320" width="230" height="40" rx="18" fill="#4f46e5" />
    <text x="900" y="345" font-family="Arial" font-size="12" fill="#ffffff">¿Qué labial me recomiendas?</text>
    
    <rect x="840" y="380" width="250" height="70" rx="18" fill="#ffffff" />
    <foreignObject x="855" y="390" width="220" height="50">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Arial; font-size: 11px; color: #4b5563;">
        Te recomendaría el labial mate de Ésika en tono "Rose Gold" que es perfecto para uso diario y tiene gran durabilidad.
      </div>
    </foreignObject>
    
    <!-- Chat Input -->
    <rect x="830" y="630" width="290" height="50" rx="25" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
    <text x="860" y="660" font-family="Arial" font-size="12" fill="#9ca3af">Escribe tu mensaje...</text>
    <circle cx="1095" cy="655" r="15" fill="#4f46e5" />
    <polygon points="1090,650 1090,660 1100,655" fill="#ffffff" />
  </g>
  
  <!-- Photo Upload Modal (Overlay) -->
  <rect x="0" y="0" width="1200" height="900" fill="rgba(0,0,0,0.5)" />
  <rect x="400" y="250" width="400" height="400" rx="8" fill="#ffffff" />
  <text x="600" y="290" font-family="Arial" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">Upload Photo</text>
  
  <!-- Close Button -->
  <circle cx="760" cy="270" r="15" fill="#f3f4f6" />
  <line x1="753" y1="263" x2="767" y2="277" stroke="#6b7280" stroke-width="2" />
  <line x1="753" y1="277" x2="767" y2="263" stroke="#6b7280" stroke-width="2" />
  
  <!-- Upload Area -->
  <rect x="430" y="320" width="340" height="240" rx="6" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5,5" fill="none" />
  <circle cx="600" cy="400" r="25" fill="#f3f4f6" />
  <polygon points="590,400 610,400 600,380" fill="#9ca3af" />
  <line x1="600" y1="400" x2="600" y2="420" stroke="#9ca3af" stroke-width="3" />
  <text x="600" y="460" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">Drag & drop image or click to browse</text>
  
  <!-- Buttons -->
  <rect x="520" y="580" width="100" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <text x="570" y="605" font-family="Arial" font-size="14" fill="#4b5563" text-anchor="middle">Cancel</text>
  
  <rect x="630" y="580" width="100" height="40" rx="6" fill="#4f46e5" />
  <text x="680" y="605" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle">Upload</text>
  
  <!-- Legend -->
  <rect x="50" y="780" width="1100" height="90" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" />
  <text x="70" y="810" font-family="Arial" font-size="16" fill="#111827" font-weight="bold">Component Legend:</text>
  
  <rect x="70" y="825" width="15" height="15" fill="#000000" />
  <text x="95" y="838" font-family="Arial" font-size="14" fill="#4b5563">VideoCallComponent</text>
  
  <rect x="250" y="825" width="15" height="15" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
  <text x="275" y="838" font-family="Arial" font-size="14" fill="#4b5563">ChatInterface</text>
  
  <rect x="400" y="825" width="15" height="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1" />
  <text x="425" y="838" font-family="Arial" font-size="14" fill="#4b5563">PhotoUploadModal</text>
  
  <rect x="570" y="825" width="15" height="15" fill="#000000" />
  <text x="595" y="838" font-family="Arial" font-size="14" fill="#4b5563">EnhancedVideoCallComponent</text>
</svg>
